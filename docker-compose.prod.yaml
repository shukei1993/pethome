services:
  pethome-mysql:
    image: mysql:5.7
    container_name: pethome-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: ${TZ}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - pethome-net

  pethome-redis:
    image: redis:5
    container_name: pethome-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - pethome-net

  pethome-app:
    image: ${ACR_REGISTRY}/pethome-shukei/app:${APP_TAG:-latest}
    container_name: pethome-app
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: pethome-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: pethome-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TZ: ${TZ}
    depends_on:
      pethome-mysql:
        condition: service_healthy
      pethome-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - pethome-net

volumes:
  mysql-data:
  redis-data:

networks:
  pethome-net:
    driver: bridge