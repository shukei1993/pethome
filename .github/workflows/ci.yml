name: CI

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'chore/**', 'ci/**' ]
#  pull_request:
#    branches: [ main ]

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build with Maven
#        run: mvn -B -DskipTests package
        run: mvn -B -Dmaven.test.skip=true package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pethome-jar
          path: target/pethome.jar
          retention-days: 7

#  docker:
#    name: Docker Build
#    runs-on: ubuntu-latest
#    needs: build
#    steps:
#      - name: Checkout
#        uses: actions/checkout@v4
#
#      - name: Build image
#        run: docker build -t pethome:ci .
#
#      - name: Show image
#        run: docker images pethome:ci
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/pethome-shukei/app:latest
            ${{ secrets.ACR_REGISTRY }}/pethome-shukei/app:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    # 后端 push 到 main 就部署；手动触发workflow_dispatch也部署，而PR不会部署（本身就不再github仓库PR）
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m          # 拉镜像可能慢，默认 10s 会超时
          script: |
            set -e
            cd /opt/pethome
            git fetch origin main
            git reset --hard origin/main
            test -f docker-compose.prod.yaml || { echo "::error::compose file missing"; ls -la; exit 1; }
            test -f nginx/nginx.conf || { echo "::error::nginx.conf missing"; exit 1; }
            cd /opt/pethome-web
            git fetch origin master
            git reset --hard origin/master
            test -d pethome-front || { echo "::error::pethome-front missing"; exit 1; }
            cd /opt/pethome
            docker run --rm -v /opt/pethome/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.25-alpine nginx -t
            APP_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yaml pull pethome-app
            APP_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yaml up -d --wait --wait-timeout 90 pethome-app pethome-nginx
            docker compose -f docker-compose.prod.yaml ps