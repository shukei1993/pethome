name: CI

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'chore/**', 'ci/**' ]
#  pull_request:
#    branches: [ main ]

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build with Maven
#        run: mvn -B -DskipTests package
        run: mvn -B -Dmaven.test.skip=true package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pethome-jar
          path: target/pethome.jar
          retention-days: 7

#  docker:
#    name: Docker Build
#    runs-on: ubuntu-latest
#    needs: build
#    steps:
#      - name: Checkout
#        uses: actions/checkout@v4
#
#      - name: Build image
#        run: docker build -t pethome:ci .
#
#      - name: Show image
#        run: docker images pethome:ci
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/pethome-shukei/app:latest
            ${{ secrets.ACR_REGISTRY }}/pethome-shukei/app:${{ github.sha }}
