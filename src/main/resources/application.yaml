server:
  port: 8080
  servlet:
    context-path: / #可以省略不写
spring:
  datasource: #数据库连接配置
    driver-class-name: com.mysql.jdbc.Driver
#    username: root
#    环境变量默认值 2016.11.13
    username: ${MYSQL_USER}
#    password: sakura1993
#    环境变量默认值 2016.11.13
    password: ${MYSQL_PASSWORD}
#   local database on windows
#    url: jdbc:mysql://localhost:3306/pethome?useUnicode=true&characterEncoding=utf8
    # 3307:3306 on docker-data mysql-data
#    url: jdbc:mysql://localhost:3307/pethome?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    # 环境变量默认值 2016.11.13
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/pethome?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
  mail:
    host: smtp.sina.cn # 服务商主机地址
    username: ${MAIL_USERNAME} # 授权邮箱
    password: ${MAIL_PASSWORD} # 授权码
    properties:
      mail.smtp.auth: true
  redis:
    database: 0 # 1号库
    host: ${REDIS_HOST:127.0.0.1} #主机地址 # 环境变量默认值 2016.11.13
    password: ${REDIS_PASSWORD} # form dokcer compose hOkI1993 # 环境变量默认值 2016.11.13
    port: ${REDIS_PORT:6379} # 端口号 # 环境变量默认值 2016.11.13
    jedis:
      pool:
        min-idle: 3 # 连接池闲时连接数
        max-active: 8 # 最大连接数
        max-wait: 2000ms # 等待时间d
mybatis:
  type-aliases-package: com.hoki.zj.org.domain,com.hoki.zj.permission.domain, com.hoki.zj.system.domain, com.hoki.zj.user.domain, com.hoki.zj.login.domain,
                        com.hoki.zj.org.domain,com.hoki.zj.pet.domain, com.hoki.zj.org.domain,com.hoki.zj.order.domain,
                        com.hoki.zj.org.domain,com.hoki.zj.pay.domain, com.hoki.zj.org.domain,com.hoki.zj.product.domain #配置别名
  mapper-locations: classpath:com/hoki/zj/org/mapper/*Mapper.xml, classpath:com/hoki/zj/permission/mapper/*Mapper.xml, classpath:com/hoki/zj/system/mapper/*Mapper.xml #扫描mapper映射文件,根据规范来写,可以省略不写
logging:
  level:
    com:
      hoki:
        zj: trace
    root: info
