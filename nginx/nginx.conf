server {
    listen 80;
    server_name _;
    server_tokens off; # 响应头里只显示 nginx，不暴露 nginx/1.25.5
    client_max_body_size 10m;
    # 开启gzip
    gzip on;
    gzip_vary on; # 加 `Vary: Accept-Encoding` 响应头，避免缓存层把压缩 / 未压缩的响应搞混
    gzip_proxied any; # 默认是 `off`，即请求带 `Via` 头时不压缩。设 `any` 才能对经代理的请求也生效
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://pethome-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # 配合 `http_version 1.1` 启用 keepalive，减少后端连接建立开销
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
